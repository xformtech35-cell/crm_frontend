name: Build and Deploy Frontend to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Vite Production Bundle
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'https://api-test.richgoldshine.com/xformcrm/api' }}
        run: npm run build

      - name: 🚀 Deploy via FTP/SFTP (If FTP secrets configured)
        if: ${{ secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/httpdocs/' }}
          state-name: .ftp-deploy-sync-state.json

      - name: 🔔 Trigger Plesk Webhook (If Webhook URL configured)
        if: ${{ secrets.PLESK_WEBHOOK_URL != '' }}
        run: |
          echo "Triggering Plesk Webhook auto-deploy..."
          curl -X POST "${{ secrets.PLESK_WEBHOOK_URL }}"
