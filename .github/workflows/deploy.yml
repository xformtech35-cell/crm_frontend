name: Build and Deploy Frontend to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Vite Production Bundle
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || 'https://api-test.richgoldshine.com/xformcrm/api' }}
        run: npm run build

      - name: 📅 Generate Backup Timestamp
        id: timestamp
        run: echo "DATE=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: 💾 Save Dated Rollback Backup Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: dist-backup-${{ env.DATE }}
          path: dist/
          retention-days: 30

      - name: 🚀 Deploy Production Files to Plesk
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
